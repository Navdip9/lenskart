<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Lenskart Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Lenskart</a>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a>
<a href="profile.html" id="nav-profile" style="display:none;">Profile</a>
        <a href="wishlist.html" class="nav-wishlist">Wishlist <span class="badge" id="wishlist-count" style="display:none;">0</span></a>
        <a href="cart.html" class="nav-cart">Cart <span class="badge" id="cart-count" style="display:none;">0</span></a>
        <a href="login.html" id="nav-login">Login</a>
        <a href="#" id="nav-logout" style="display:none;" onclick="logoutUser(); return false;">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container">
    <h2 class="section-title">Your Cart</h2>
    <div id="cart-empty" class="cart-empty" style="display:none;"><p>Your cart is empty.</p><a href="products.html" class="btn btn-primary">Browse Products</a></div>
    <div id="cart-content">
      <div id="cart-items"></div>
      <div class="cart-total-box">
        <div class="total-row"><span>Total</span><span id="cart-total">₹0</span></div>
        <div class="total-row grand-total"><span>Grand Total</span><span id="cart-total-final">₹0</span></div>
        <button type="button" class="btn btn-primary" style="width:100%; margin-top:1rem;" id="place-order">Place Order</button>
      </div>
    </div>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a><a href="profile.html" id="footer-profile" style="display:none;">Profile</a><a href="cart.html">Cart</a><a href="login.html" id="footer-login">Login</a><a href="register.html" id="footer-register">Register</a><a href="#" id="footer-logout" style="display:none;" onclick="logoutUser(); return false;">Logout</a>
      </div>
      <div class="footer-bottom">&copy; Navdip Talsaniya.</div>
    </div>
  </footer>
<script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
  <script src="js/cart.js"></script>
  <script>
    updateNavbar();
    if (typeof updateFooterAuth === 'function') updateFooterAuth();
    updateCartBadge();
    document.getElementById('place-order').onclick = placeOrder;
    renderCartPage();
  </script>
</body>
</html>
