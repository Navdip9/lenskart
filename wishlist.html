<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - Lenskart Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Lenskart</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html" id="nav-profile" style="display:none;">Profile</a>
        <a href="wishlist.html" class="nav-wishlist">Wishlist <span class="badge" id="wishlist-count" style="display:none;">0</span></a>
        <a href="cart.html" class="nav-cart">Cart <span class="badge" id="cart-count" style="display:none;">0</span></a>
        <a href="login.html" id="nav-login">Login</a>
        <a href="#" id="nav-logout" style="display:none;" onclick="logoutUser(); return false;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="section-title">My Wishlist</h2>
    <div id="wishlist-empty" class="wishlist-empty" style="display:none;">
      <p>Your wishlist is empty.</p>
      <a href="products.html" class="btn btn-primary">Browse Products</a>
    </div>
    <div id="wishlist-content" class="wishlist-container"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a><a href="profile.html" id="footer-profile" style="display:none;">Profile</a><a href="cart.html">Cart</a><a href="wishlist.html">Wishlist</a><a href="login.html" id="footer-login">Login</a><a href="register.html" id="footer-register">Register</a><a href="#" id="footer-logout" style="display:none;" onclick="logoutUser(); return false;">Logout</a>
      </div>
      <div class="footer-bottom">&copy; Navdip Talsaniya.</div>
    </div>
  </footer>

<script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderWishlistPage() {
      var wishlist = getWishlist();
      var emptyEl = document.getElementById('wishlist-empty');
      var contentEl = document.getElementById('wishlist-content');
      
      if (wishlist.length === 0) {
        emptyEl.style.display = 'block';
        contentEl.style.display = 'none';
      } else {
        emptyEl.style.display = 'none';
        contentEl.style.display = 'block';
        
        contentEl.innerHTML = '';
        wishlist.forEach(function(item) {
          var div = document.createElement('div');
          div.className = 'wishlist-item';
          div.dataset.productId = item.productId;
          
          var fallbackImg = 'https://via.placeholder.com/300/0066cc/ffffff?text=Eyewear';
          var rating = getProductRating(item.productId);
          var reviewCount = getProductReviewCount(item.productId);
          var ratingHtml = '';
          if (rating > 0) {
            var fullStars = Math.floor(rating);
            var starsHtml = '';
            for (var i = 1; i <= 5; i++) {
              starsHtml += i <= fullStars ? '★' : '☆';
            }
            ratingHtml = '<div class="product-rating" style="margin-bottom: 0.5rem;">' + starsHtml + ' <span class="rating-value">' + rating.toFixed(1) + '</span> <span class="rating-count">(' + reviewCount + ')</span></div>';
          }
          
          div.innerHTML = '<img src="' + (item.imageUrl || fallbackImg) + '" alt="' + item.name + '" onerror="this.src=\'' + fallbackImg + '\'">' +
            '<div class="wishlist-item-details">' +
            '<div class="wishlist-item-name">' + item.name + '</div>' +
            '<div class="wishlist-item-category">' + (item.category || 'Eyewear') + '</div>' +
            ratingHtml +
            '<div class="wishlist-item-price">₹' + item.price + '</div>' +
            '</div>' +
            '<div class="wishlist-item-actions">' +
            '<button class="btn btn-primary add-to-cart-btn">Add to Cart</button>' +
            '<button class="remove-wishlist-btn">Remove</button>' +
            '</div>';
          
          // Add to cart button
          var addToCartBtn = div.querySelector('.add-to-cart-btn');
          addToCartBtn.addEventListener('click', function() {
            addToCart(item.productId);
            removeFromWishlist(item.productId);
            renderWishlistPage();
          });
          
          // Remove button
          var removeBtn = div.querySelector('.remove-wishlist-btn');
          removeBtn.addEventListener('click', function() {
            removeFromWishlist(item.productId);
            renderWishlistPage();
          });
          
          contentEl.appendChild(div);
        });
      }
    }
    
    updateNavbar();
    updateCartBadge();
    updateWishlistBadge();
    if (typeof updateFooterAuth === 'function') updateFooterAuth();
    renderWishlistPage();
  </script>
</body>
</html>
