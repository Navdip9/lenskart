<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Lenskart Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Lenskart</a>
<div class="nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a>
        <a href="profile.html" id="nav-profile" style="display:none;">Profile</a>
        <a href="wishlist.html" class="nav-wishlist">Wishlist <span class="badge" id="wishlist-count" style="display:none;">0</span></a>
        <a href="cart.html" class="nav-cart">Cart <span class="badge" id="cart-count" style="display:none;">0</span></a>
        <a href="login.html" id="nav-login">Login</a>
        <a href="#" id="nav-logout" style="display:none;" onclick="logoutUser(); return false;">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container">
    <h2 class="section-title">Contact Us</h2>
    <p style="margin-bottom:1rem; color: var(--text-light);">Have a question? Send us a message.</p>
    <div id="contact-alert"></div>
    <div class="form-card" style="max-width: 560px;">
      <form id="contact-form">
        <div class="form-group"><label for="name">Name</label><input type="text" id="name" required placeholder="Your name"></div>
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" required placeholder="your@email.com"></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" required placeholder="Your message..."></textarea></div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a><a href="profile.html" id="footer-profile" style="display:none;">Profile</a><a href="cart.html">Cart</a><a href="login.html" id="footer-login">Login</a><a href="register.html" id="footer-register">Register</a><a href="#" id="footer-logout" style="display:none;" onclick="logoutUser(); return false;">Logout</a>
      </div>
      <div class="footer-bottom">&copy; Navdip Talsaniya.</div>
    </div>
  </footer>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
  <script src="js/cart.js"></script>
  <script>
updateNavbar();
    if (typeof updateFooterAuth === 'function') updateFooterAuth();
    updateCartBadge();
    updateWishlistBadge();
    document.getElementById('contact-form').onsubmit = function(e) {
      e.preventDefault();
      var contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
      contacts.push({ name: document.getElementById('name').value.trim(), email: document.getElementById('email').value.trim(), message: document.getElementById('message').value.trim(), date: new Date().toISOString() });
      localStorage.setItem('contacts', JSON.stringify(contacts));
      document.getElementById('contact-alert').innerHTML = '<div class="alert alert-success">Message sent!</div>';
      this.reset();
    };
  </script>
</body>
</html>
