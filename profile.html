<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Lenskart Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Lenskart</a>
      <div class="nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a>
<a href="profile.html" id="nav-profile">Profile</a>
        <a href="wishlist.html" class="nav-wishlist">Wishlist <span class="badge" id="wishlist-count" style="display:none;">0</span></a>
        <a href="cart.html" class="nav-cart">Cart <span class="badge" id="cart-count" style="display:none;">0</span></a>
        <a href="login.html" id="nav-login" style="display:none;">Login</a>
        <a href="#" id="nav-logout" onclick="logoutUser(); return false;">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container">
    <h2 class="section-title">My Profile</h2>
    <div id="profile-area"></div>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-nav-links">
        <a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a><a href="profile.html" id="footer-profile">Profile</a><a href="cart.html">Cart</a><a href="login.html" id="footer-login" style="display:none;">Login</a><a href="register.html" id="footer-register" style="display:none;">Register</a><a href="#" id="footer-logout" onclick="logoutUser(); return false;">Logout</a>
      </div>
      <div class="footer-bottom">&copy; Navdip Talsaniya.</div>
    </div>
  </footer>
<script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
  <script src="js/cart.js"></script>
  <script>
    var user = requireUser();
    if (typeof updateFooterAuth === 'function') updateFooterAuth();
    if (user) {
      updateNavbar();
      updateCartBadge();
      var stats = getUserOrderStats(user.id);
      var orders = getUserOrders(user.id);
      var ordersHtml = '';
      if (orders.length > 0) {
        ordersHtml = '<div class="profile-card my-orders-card"><h2>My Orders</h2><div class="user-orders-list">' +
          orders.map(function(o) {
            var status = o.status || 'Pending';
            var statusClass = 'order-status order-status-' + status.toLowerCase();
            var statusLabel = getStatusLabel(status);
            var cancelBtn = canCancelOrder(o) ? '<button type="button" class="btn btn-danger btn-cancel-order" data-id="' + o.id + '">Cancel Order</button>' : '';
            return '<div class="user-order-item" data-id="' + o.id + '">' +
              '<div class="user-order-row"><span class="user-order-id">Order #' + o.id + '</span><span class="' + statusClass + '">' + statusLabel + '</span></div>' +
              '<div class="user-order-meta">' + new Date(o.date).toLocaleString() + ' &middot; ₹' + (o.totalAmount || 0).toFixed(0) + '</div>' +
              '<div class="user-order-items">' + (o.items || []).map(function(i) { return i.name + ' × ' + i.quantity; }).join(', ') + '</div>' +
              (cancelBtn ? '<div class="user-order-actions">' + cancelBtn + '</div>' : '') +
              '</div>';
          }).join('') +
          '</div></div>';
      }
      document.getElementById('profile-area').innerHTML =
        '<div class="profile-card"><h2>Account Details</h2>' +
        '<div class="profile-row"><span>Name</span><span>' + user.name + '</span></div>' +
        '<div class="profile-row"><span>Email</span><span>' + user.email + '</span></div></div>' +
        '<div class="profile-stats">' +
        '<div class="profile-stat"><span class="value">' + stats.totalOrders + '</span><span class="label">Total Orders</span></div>' +
        '<div class="profile-stat"><span class="value">₹' + stats.totalSpent.toFixed(0) + '</span><span class="label">Total Amount Spent</span></div></div>' +
        ordersHtml;
      document.getElementById('profile-area').addEventListener('click', function(e) {
        var btn = e.target.closest('.btn-cancel-order');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        if (!id) return;
        if (!confirm('Are you sure you want to cancel this order?')) return;
        if (cancelOrder(id)) {
          var area = document.getElementById('profile-area');
          var stats = getUserOrderStats(user.id);
          var orders = getUserOrders(user.id);
          var oHtml = '';
          if (orders.length > 0) {
            oHtml = '<div class="profile-card my-orders-card"><h2>My Orders</h2><div class="user-orders-list">' +
              orders.map(function(o) {
                var status = o.status || 'Pending';
                var statusClass = 'order-status order-status-' + status.toLowerCase();
                var statusLabel = getStatusLabel(status);
                var cancelBtn = canCancelOrder(o) ? '<button type="button" class="btn btn-danger btn-cancel-order" data-id="' + o.id + '">Cancel Order</button>' : '';
                return '<div class="user-order-item" data-id="' + o.id + '">' +
                  '<div class="user-order-row"><span class="user-order-id">Order #' + o.id + '</span><span class="' + statusClass + '">' + statusLabel + '</span></div>' +
                  '<div class="user-order-meta">' + new Date(o.date).toLocaleString() + ' &middot; ₹' + (o.totalAmount || 0).toFixed(0) + '</div>' +
                  '<div class="user-order-items">' + (o.items || []).map(function(i) { return i.name + ' × ' + i.quantity; }).join(', ') + '</div>' +
                  (cancelBtn ? '<div class="user-order-actions">' + cancelBtn + '</div>' : '') +
                  '</div>';
              }).join('') + '</div></div>';
          }
          area.innerHTML = '<div class="profile-card"><h2>Account Details</h2><div class="profile-row"><span>Name</span><span>' + user.name + '</span></div><div class="profile-row"><span>Email</span><span>' + user.email + '</span></div></div>' +
            '<div class="profile-stats"><div class="profile-stat"><span class="value">' + stats.totalOrders + '</span><span class="label">Total Orders</span></div><div class="profile-stat"><span class="value">₹' + stats.totalSpent.toFixed(0) + '</span><span class="label">Total Amount Spent</span></div></div>' + oHtml;
        } else {
          alert('This order cannot be cancelled.');
        }
      });
    }
  </script>
</body>
</html>
